name: Web UI Cross Repo

on:
  pull_request:
    branches:
      - maintenance-3.1.x
      - lts-2025

  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        type: string
        required: false
    secrets:
      GIT_ADMIN_TOKEN:
        description: 'GIT_ADMIN_TOKEN'
        required: true

permissions:
  contents: read

# Cancel a stale in-flight cross-repo check (and its poller) for the same PR when a newer commit
# is pushed, so superseded ~1h ftest runs don't keep consuming runners. `github.ref` is unique per
# PR (refs/pull/<n>/merge) and per branch, avoiding collisions between PRs that share a head branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || github.base_ref }}

jobs:
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Web UI cross repo check
        uses: nuxeo/ui-team-gh-actions/trigger-workflow@46f1ea323a97203402dbc57d0537bd5b6a6099eb
        with:
          owner: nuxeo
          repo: nuxeo-web-ui
          workflow-id: cross-repo.yaml
          access-token: ${{ secrets.GIT_ADMIN_TOKEN }}
          branch-name: ${{ github.base_ref }}
          inputs: |
            branch_name: ${{ env.BRANCH_NAME }}
            sauce_labs: false
            skip_ftests: false
            skip_a11y: false
            skip_unit_tests: false
            generate_metrics: false
            run_all: false
            bail: 0