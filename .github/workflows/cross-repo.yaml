name: Web UI

on:
  pull_request:
    branches:
      - maintenance-3.1.x
  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        default: maintenance-3.1.x
        type: string
        required: false

permissions:
  contents: read
  actions: write   # 👈 REQUIRED for triggering another workflow

env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'maintenance-3.1.x' }}

jobs:
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Web UI cross repo check
        uses: nuxeo/ui-team-gh-actions/trigger-workflow@dcf8be425447c7fb9cdd1e048585a6df905ed878
        with:
          owner: nuxeo
          repo: nuxeo-web-ui
          workflow-id: cross-repo.yaml
          access-token: ${{ secrets.GITHUB_TOKEN }}
          branch-name: maintenance-3.1.x
          inputs: |
            branch_name: ${{ env.BRANCH_NAME }}
            sauce_labs: false
            skip_ftests: false
            skip_a11y: false
            skip_unit_tests: false
            generate_metrics: false
            run_all: false
            bail: 0