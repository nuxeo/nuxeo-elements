name: Test

on:
  pull_request:
    branches:
      - maintenance-3.1.x
  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        default: maintenance-3.1.x
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        description: 'NPM_PACKAGES_TOKEN'
        required: true
      SAUCE_ACCESS_KEY:
        description: 'SAUCE_ACCESS_KEY'
        required: true
        
permissions:
  contents: read

env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'maintenance-3.1.x' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Branch protection requires a check named exactly "test", so the Node 24
    # leg must keep that name. Without this the matrix would report only the
    # suffixed names and the required check would wait forever.
    name: ${{ matrix.node-version == 24 && 'test' || format('test (node {0})', matrix.node-version) }}
    strategy:
      # 24 is the CI runtime; 22.13.0 is the exact floor declared in
      # engines.node and must keep passing. Pinned to the patch version on
      # purpose — `22` resolves to the newest 22.x, which would leave the
      # version we actually promise untested.
      fail-fast: false
      matrix:
        node-version: ['22.13.0', 24]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Test
        # Unit tests run on @web/test-runner with a bundled Puppeteer Chromium
        # (installed by the `pretest` npm hook). No SauceLabs / system Chrome needed.
        run: npm run test
