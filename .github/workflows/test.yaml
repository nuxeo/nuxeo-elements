name: Test

on:
  pull_request:
    branches:
      - 'lts-20[0-9][0-9]'
      - 'develop-20[0-9][0-9]'
  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        description: 'NPM_PACKAGES_TOKEN'
        required: true
      SAUCE_ACCESS_KEY:
        description: 'SAUCE_ACCESS_KEY'
        required: true
        
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Test
        # Unit tests run on @web/test-runner with a bundled Puppeteer Chromium
        # (installed by the `pretest` npm hook). No SauceLabs / system Chrome needed.
        run: npm run test
