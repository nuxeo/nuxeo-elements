name: Storybook

on:
  pull_request:
    branches:
      - maintenance-3.1.x
      - 'develop-20[0-9][0-9]'
  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        description: 'NPM_PACKAGES_TOKEN'
        required: true
      GIT_ADMIN_TOKEN:
        description: 'GIT_ADMIN_TOKEN'
        required: false

permissions:
  contents: write

jobs:
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Honour an explicit workflow_call branch. Empty on pull_request, which leaves
          # checkout on the PR merge commit instead of the head branch.
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Run analysis
        run: npx --no-install --ignore-scripts lerna@9.0.7 run analysis --parallel

      - name: Build storybook
        working-directory: storybook
        run: |
          npx --no-install --ignore-scripts storybook@10.5.0 build -o dist

      - name: Deploy
        # Gated on github.ref, not the checked-out ref. The post-release sync pull request is
        # headed by a branch tracking the release branch, so matching on a branch name alone
        # would publish Storybook from an unmerged pull request.
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/maintenance-3.1.x' }}
        env:
          GH_TOKEN: nuxeo-webui-jx-bot:${{ secrets.GIT_ADMIN_TOKEN }}
        working-directory: storybook
        run: npm run deploy -- --ci --existing-output-dir=dist
