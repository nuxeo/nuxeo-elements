name: Lint

on:
  pull_request:
    branches:
      - lts-2025
  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        default: lts-2025
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        description: 'NPM_PACKAGES_TOKEN'
        required: true
        
permissions:
  contents: read

env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'lts-2025' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    # Branch protection requires a check named exactly "lint", so the Node 24
    # leg must keep that name. Without this the matrix would report only
    # "lint (22.13.0)" / "lint (24)" and the required check would wait forever.
    name: ${{ matrix.node-version == 24 && 'lint' || format('lint (node {0})', matrix.node-version) }}
    strategy:
      # The eslint stack is what sets engines.node, so the floor has to be
      # linted, not just tested. 22.13.0 is pinned exactly: `22` would resolve
      # to the newest 22.x and never exercise the version we actually promise.
      fail-fast: false
      matrix:
        node-version: ['22.13.0', 24]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint
