name: Lint

on:
  pull_request:
    branches:
      - maintenance-3.1.x
  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        default: maintenance-3.1.x
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        description: 'NPM_PACKAGES_TOKEN'
        required: true
        
permissions:
  contents: read

env:
  BRANCH_NAME: ${{ github.head_ref || inputs.branch || 'maintenance-3.1.x' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      # The eslint stack is what sets engines.node, so the floor has to be
      # linted, not just tested. 22.13.0 is pinned exactly: `22` would resolve
      # to the newest 22.x and never exercise the version we actually promise.
      fail-fast: false
      matrix:
        node-version: ['22.13.0', 24]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint
