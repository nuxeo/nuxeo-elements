name: Lint

on:
  pull_request:
    branches:
      - maintenance-3.1.x
      - 'develop-20[0-9][0-9]'
  workflow_call:
    inputs:
      branch:
        description: 'The current branch'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        description: 'NPM_PACKAGES_TOKEN'
        required: true
        
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Honour an explicit workflow_call branch. Empty on pull_request, which leaves
          # checkout on the PR merge commit instead of the head branch.
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          scope: '@nuxeo'

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint
