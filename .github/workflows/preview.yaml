name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - lts-2025

env:
  REGISTRY: docker-internal.packages.nuxeo.com
  STORYBOOK_REPOSITORY: nuxeo/nuxeo-elements/storybook

permissions:
  contents: read
  pull-requests: write

jobs:
  storybook:
    name: Storybook
    if: (github.event.action == 'labeled' && github.event.label.name == 'preview') || contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
        scope: '@nuxeo'

    - name: Prepare environment
      # Image version <version-without-snapshot>-preview.<run_id> so Flux detects it by semver and deploys to EKS.
      run: |
        BASE_VERSION="$(node -p 'require("./package.json").version')"
        VERSION_BASE="$(echo "$BASE_VERSION" | sed -E 's/-SNAPSHOT$//I')"
        echo "VERSION=${VERSION_BASE}-preview.${{ github.run_id }}" >> "$GITHUB_ENV"

    - name: Install
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      run: npm ci --ignore-scripts

    - name: Run analysis
      run: npx lerna run analysis --parallel

    - name: Build storybook
      working-directory: ./storybook
      run: |
        npx storybook build -o dist

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Nuxeo Docker registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
        password: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}

    - name: Build and push Storybook image
      uses: docker/build-push-action@v7
      with:
        context: ./storybook
        push: true
        platforms: linux/amd64
        tags: ${{ env.REGISTRY }}/${{ env.STORYBOOK_REPOSITORY }}:${{ env.VERSION }}

    - uses: actions/github-script@v9
      if: github.event_name == 'pull_request'
      env:
        IMAGE: ${{ env.REGISTRY }}/${{ env.STORYBOOK_REPOSITORY }}:${{ env.VERSION }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `:star: Storybook preview image published: \`${process.env.IMAGE}\`\nFlux will deploy it to the Elements Storybook preview environment (allow ~5-10 min).`
          })

  webui-preview:
    name: Web UI
    runs-on: ubuntu-latest
    if: (github.event.action == 'labeled' && github.event.label.name == 'webui-preview') || contains(github.event.pull_request.labels.*.name, 'webui-preview')
    steps:
      - uses: actions/checkout@v6

      - name: Prepare environment
        run: |
          echo "BRANCH_NAME=${GITHUB_HEAD_REF}" >> $GITHUB_ENV

      - name: Web UI preview
        id: main
        uses: nuxeo/ui-team-gh-actions/trigger-workflow@a5b89f35e0d1f3a912f528d7f1c3acdb73c60549
        with:
          owner: nuxeo
          repo: nuxeo-web-ui
          workflow-id: preview.yaml
          access-token: ${{ secrets.GIT_ADMIN_TOKEN }}
          branch-name: lts-2025
          inputs: |
            branch_name: ${{ env.BRANCH_NAME }}

      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `:star: Web UI preview image published: \`${{ steps.main.outputs.message }}\`\nFlux will deploy it to the Web UI preview environment (allow ~5-10 min).`
            })
