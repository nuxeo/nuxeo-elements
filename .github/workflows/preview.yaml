name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - maintenance-3.1.x

permissions:
  contents: read
  pull-requests: write

jobs:
  webui-preview:
    name: Web UI
    runs-on: ubuntu-latest
    if: (github.event.action == 'labeled' && github.event.label.name == 'webui-preview') || contains(github.event.pull_request.labels.*.name, 'webui-preview')
    steps:
      - uses: actions/checkout@v6

      - name: Prepare environment
        run: |
          echo "BRANCH_NAME=${GITHUB_HEAD_REF}" >> $GITHUB_ENV

      - name: Web UI preview
        id: main
        uses: nuxeo/ui-team-gh-actions/trigger-workflow@a5b89f35e0d1f3a912f528d7f1c3acdb73c60549
        with:
          owner: nuxeo
          repo: nuxeo-web-ui
          workflow-id: preview.yaml
          access-token: ${{ secrets.GIT_ADMIN_TOKEN }}
          branch-name: maintenance-3.1.x
          inputs: |
            branch_name: ${{ env.BRANCH_NAME }}

      - uses: actions/github-script@v9
        env:
          # Fixed per-LTS Flux preview env (LTS-2025 uses nuxeo-web-ui-25)
          WEBUI_PREVIEW_URL: https://nuxeo-web-ui-23.build.nuxeo.com
          WEBUI_PREVIEW_IMAGE: ${{ steps.main.outputs.message }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `:star: Web UI preview will be available [here](${process.env.WEBUI_PREVIEW_URL}) once Flux rolls out the image (~5-10 min).\n\nImage: \`${process.env.WEBUI_PREVIEW_IMAGE}\``
            })
