name: SonarQube

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - maintenance-3.1.x
      - 'develop-20[0-9][0-9]'

  push:
    branches:
      - maintenance-3.1.x
      - 'develop-20[0-9][0-9]'

  workflow_dispatch:

  workflow_call:
    inputs:
      branch:
        description: 'Branch to analyze'
        type: string
        required: false
    secrets:
      NPM_PACKAGES_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: catchpoint/workflow-telemetry-action@94c3c3d9567a0205de6da68a76c428ce4e769af1 # v2
        with:
          comment_on_pr: false

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Run git config
        run: git config user.name "nuxeo-webui-jx-bot" && git config user.email "webui@hyland.com"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://packages.nuxeo.com/repository/npm-public/'
          node-version: 22
          scope: '@nuxeo'

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install npm dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts
        working-directory: ${{ github.workspace }}

      - name: Run unit tests with coverage
        run: npm test
        working-directory: ${{ github.workspace }}

      - name: Resolve project version and branch
        id: project_meta
        env:
          # Through the environment, not interpolated: github.head_ref is chosen by whoever
          # opens the pull request and a git ref may legally contain $( ) or backticks.
          # head_ref = PR source branch, ref_name = push branch, inputs.branch = workflow_call.
          # git HEAD is detached on pull_request and push events, hence not reading it from git.
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          # inputs.branch before ref_name: in a reusable workflow ref_name is always the
          # caller's ref, so it would win even though the checkout above honours the input.
          # Dispatching main.yaml from another ref would then scan one branch and file the
          # result under another.
          echo "branch=${HEAD_REF:-${INPUT_BRANCH:-$REF_NAME}}" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}

      - name: Build and analyze
        id: sonar_scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.projectVersion=${{ steps.project_meta.outputs.version }}
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.qualitygate.wait=true
            ${{ github.event_name == 'pull_request' &&
            format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
            github.event.pull_request.number,
            github.event.pull_request.head.ref,
            github.event.pull_request.base.ref)
            || format('-Dsonar.branch.name={0}', steps.project_meta.outputs.branch) }}

      - name: Enforce Quality Gate
        # Fails if sonar scan was skipped (e.g. prior step failed) or gate not passed.
        if: always()
        run: |
          if [ "${{ steps.sonar_scan.outcome }}" = "skipped" ]; then
            echo "❌ SonarCloud scan was skipped — a prior step (e.g. coverage baseline) failed."
            exit 1
          fi
          if [ "${{ steps.sonar_scan.outcome }}" != "success" ]; then
            echo "❌ SonarCloud Quality Gate FAILED. Fix flagged issues before merging."
            echo "   • New-code coverage must be ≥ 90 %"
            echo "   • No unresolved code-quality issues on new/changed code"
            exit 1
          fi
          echo "✅ SonarCloud Quality Gate passed."
