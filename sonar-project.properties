sonar.projectKey=nuxeo_nuxeo-elements
sonar.projectName=Nuxeo Elements
sonar.organization=nuxeo

# JS/HTML front-end sources
sonar.sources=core,ui,dataviz,testing-helpers,.github

# Test files
sonar.tests=core/test,ui/test,dataviz/test

# Coverage reports from Web Test Runner + Istanbul (one per package)
sonar.javascript.lcov.reportPaths=coverage/core/lcov.info,coverage/ui/lcov.info,coverage/dataviz/lcov.info

# File extensions to include
sonar.inclusions=**/*.js,**/*.html,**/*.json,**/*.css,**/*.yaml,**/*.yml

# Exclude build output, node_modules, generated files, vendor and coverage
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.tmp/**,\
  **/.scannerwork/**,\
  **/target/**,\
  **/coverage/**,\
  **/vendor/**,\
  storybook/**,\
  ui/viewers/pdfjs/**,\
  ui/js-interpreter/**,\
  ui/i18n/**/*.json

# Exclude files from coverage metrics that cannot be practically covered by Web Test Runner unit tests.
#
# Categories:
#  - Test files themselves
#  - HTML files (**.html) — while many contain inline <script> with executable Polymer logic,
#    Istanbul does not instrument <script> blocks inside HTML via the Web Test Runner ESM pipeline;
#    only standalone .js modules are instrumented for coverage
#  - CSS / JSON / YAML — no executable code
#  - Demo files — development-only, not production code
#  - Barrel/index files — side-effect import registrations, no exportable logic:
#    core/nuxeo-elements.js, dataviz/nuxeo-dataviz-elements.js, ui/nuxeo-ui-elements.js
#  - ui/import-href.js — Polymer HTML imports polyfill, relies on window.HTMLImports browser API
#  - ui/js-interpreter/** — vendored Google JS Interpreter (third-party, Apache-2.0)
#  - ui/viewers/pdfjs/** — vendored PDF.js viewer, not our code
#  - testing-helpers/** — test infrastructure/utilities, not production code
#  - .github/ — CI workflow YAML/JS, not application code
sonar.coverage.exclusions=\
  **/*.test.js,\
  **/*.html,\
  **/*.css,\
  **/*.yaml,\
  **/*.yml,\
  **/*.json,\
  **/test/**,\
  **/demo/**,\
  core/nuxeo-elements.js,\
  dataviz/nuxeo-dataviz-elements.js,\
  ui/nuxeo-ui-elements.js,\
  ui/import-href.js,\
  ui/js-interpreter/**,\
  ui/viewers/pdfjs/**,\
  testing-helpers/**,\
  .github/**

# Treat test files as test code, not source
sonar.test.inclusions=**/test/**/*.test.js

sonar.sourceEncoding=UTF-8

# Block PR merge on Quality Gate failure.
# Gate conditions (set in SonarCloud UI, new code only): Coverage >= 90%, Issues == 0, Hotspots reviewed == 100%, Duplications <= 3%
# Note: sonar.qualitygate.wait is set via workflow args to ensure it applies in all scan modes.

# Suppress all issues in CI workflow files — npm install with preinstall scripts is intentional.
# TODO: Remove once sub-packages have package-lock.json and npm ci can be used safely.
