sonar.projectKey=nuxeo_nuxeo-elements
sonar.projectName=Nuxeo Elements
sonar.organization=nuxeo

# JS/HTML front-end sources
sonar.sources=core,ui,dataviz,testing-helpers,.github

# Test files
sonar.tests=core/test,ui/test,dataviz/test

# Coverage reports from Web Test Runner + Istanbul (one per package)
sonar.javascript.lcov.reportPaths=coverage/core/lcov.info,coverage/ui/lcov.info,coverage/dataviz/lcov.info

# File extensions to include
sonar.inclusions=**/*.js,**/*.html,**/*.json,**/*.css,**/*.yaml,**/*.yml

# Exclude build output, node_modules, generated files, vendor and coverage, plus
# development-only pages that are not part of the shipped product (ELEMENTS-2056).
#
#  - **/demo/** — legacy `polymer serve` demo pages (69 pages under ui/, core/, dataviz/).
#    Not imported by any module, not built, not run in CI, and not deployed; the public
#    documentation at nuxeo.github.io/nuxeo-elements is published from storybook/ by
#    .github/workflows/storybook.yaml. README calls these "the legacy demos"; they only
#    render under `npm run docs` (polymer-cli `polymer serve`), which resolves their
#    /components/... asset paths. Every finding currently raised here is a Web:* HTML
#    page-boilerplate or a11y rule (missing lang / DOCTYPE / table header) on pages that have
#    no end users, so there is no accessibility benefit to fixing them. The 6 demo .js helper
#    files (nuxeo-demo.js, nuxeo-demo-theme.js and the 4 per-element demo elements) are
#    currently clean and leave analysis scope along with the pages they serve.
#    Already excluded from coverage below.
#  - core|ui|dataviz/index.html — bare <iron-component-page> docs shells, served only by
#    the same legacy `polymer serve` docs flow.
#  - ui/test/layouts/** — unit-test fixtures fetched at runtime by the nuxeo-layout,
#    nuxeo-document-layout, nuxeo-search-form-layout, nuxeo-search-results-layout and
#    nuxeo-document-picker test suites. Not published (see ui/.npmignore). They carry
#    role="widget" deliberately, to mirror real layouts: role="widget" is a functional
#    selector in the layout engine (nuxeo-web-ui elements/bulk/nuxeo-edit-documents-button.js
#    matches '[role="widget"], nuxeo-data-table[role="table"]'), so "fixing" the ARIA
#    finding here would diverge the fixtures from production and break these tests. Whether
#    role="widget" is acceptable at all is a product-wide decision tracked on WEBUI-2229,
#    where all 528 shipped occurrences remain visible to Sonar.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.tmp/**,\
  **/.scannerwork/**,\
  **/target/**,\
  **/coverage/**,\
  **/vendor/**,\
  storybook/**,\
  ui/viewers/pdfjs/**,\
  ui/js-interpreter/**,\
  ui/i18n/**/*.json,\
  **/demo/**,\
  core/index.html,\
  ui/index.html,\
  dataviz/index.html,\
  ui/test/layouts/**

# Exclude files from coverage metrics that cannot be practically covered by Web Test Runner unit tests.
#
# Categories:
#  - Test files themselves
#  - HTML files (**.html) — while many contain inline <script> with executable Polymer logic,
#    Istanbul does not instrument <script> blocks inside HTML via the Web Test Runner ESM pipeline;
#    only standalone .js modules are instrumented for coverage
#  - CSS / JSON / YAML — no executable code
#  - Demo files — development-only, not production code
#  - Barrel/index files — side-effect import registrations, no exportable logic:
#    core/nuxeo-elements.js, dataviz/nuxeo-dataviz-elements.js, ui/nuxeo-ui-elements.js
#  - ui/import-href.js — Polymer HTML imports polyfill, relies on window.HTMLImports browser API
#  - ui/js-interpreter/** — vendored Google JS Interpreter (third-party, Apache-2.0)
#  - ui/viewers/pdfjs/** — vendored PDF.js viewer, not our code
#  - testing-helpers/** — test infrastructure/utilities, not production code
#  - .github/ — CI workflow YAML/JS, not application code
sonar.coverage.exclusions=\
  **/*.test.js,\
  **/*.html,\
  **/*.css,\
  **/*.yaml,\
  **/*.yml,\
  **/*.json,\
  **/test/**,\
  **/demo/**,\
  core/nuxeo-elements.js,\
  dataviz/nuxeo-dataviz-elements.js,\
  ui/nuxeo-ui-elements.js,\
  ui/import-href.js,\
  ui/js-interpreter/**,\
  ui/viewers/pdfjs/**,\
  testing-helpers/**,\
  .github/**

# Treat test files as test code, not source
sonar.test.inclusions=**/test/**/*.test.js

sonar.sourceEncoding=UTF-8

# Block PR merge on Quality Gate failure.
# Gate conditions (set in SonarCloud UI, new code only): Coverage >= 90%, Issues == 0, Hotspots reviewed == 100%, Duplications <= 3%
# Note: sonar.qualitygate.wait is set via workflow args to ensure it applies in all scan modes.

# Suppress all issues in CI workflow files — npm install with preinstall scripts is intentional.
# TODO: Remove once sub-packages have package-lock.json and npm ci can be used safely.
