sonar.projectKey=nuxeo_nuxeo-elements
sonar.projectName=Nuxeo Elements
sonar.organization=nuxeo

# JS/HTML front-end sources
sonar.sources=core,ui,dataviz,testing-helpers,.github

# Test files
sonar.tests=core/test,ui/test,dataviz/test

# Coverage reports from Karma + Istanbul (one per package)
sonar.javascript.lcov.reportPaths=coverage/core/lcov.info,coverage/ui/lcov.info,coverage/dataviz/lcov.info

# File extensions to include
sonar.inclusions=**/*.js,**/*.html,**/*.json,**/*.css,**/*.yaml,**/*.yml

# Exclude build output, node_modules, generated files, vendor and coverage
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.tmp/**,\
  **/.scannerwork/**,\
  **/target/**,\
  **/coverage/**,\
  **/vendor/**,\
  storybook/**,\
  ui/viewers/pdfjs/**,\
  ui/i18n/**/*.json

# Exclude test/generated files from coverage metrics
sonar.coverage.exclusions=\
  **/*.test.js,\
  **/*.yaml,\
  **/*.yml,\
  **/test/**,\
  ui/viewers/pdfjs/**,\
  ui/i18n/**/*.json

# Treat test files as test code, not source
sonar.test.inclusions=**/test/**/*.test.js

sonar.sourceEncoding=UTF-8

# Block PR merge on Quality Gate failure.
# Gate conditions (set in SonarCloud UI, new code only): Coverage >= 90%, Issues == 0, Hotspots reviewed == 100%, Duplications <= 3%
# Note: sonar.qualitygate.wait is set via workflow args to ensure it applies in all scan modes.

# Suppress all issues in CI workflow files — npm install with preinstall scripts is intentional.
# TODO: Remove once sub-packages have package-lock.json and npm ci can be used safely.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**
