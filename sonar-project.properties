sonar.projectKey=nuxeo_nuxeo-elements
sonar.projectName=Nuxeo Elements
sonar.organization=nuxeo

# Source files to analyze (JS and HTML front-end sources)
sonar.sources=core,ui,dataviz,testing-helpers,.github

# Test files
sonar.tests=core/test,ui/test,dataviz/test,testing-helpers/test

# Coverage report generated by Karma + Istanbul
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# File extensions to include
sonar.inclusions=**/*.js,**/*.html,**/*.json,**/*.css,**/*.yaml,**/*.yml

# Exclude build output, node_modules, generated files, vendor and coverage
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.tmp/**,\
  **/.scannerwork/**,\
  **/target/**,\
  **/coverage/**,\
  **/vendor/**,\
  storybook/**,\
  ui/i18n/**/*.json

# Exclude generated/third-party/test files from coverage metrics
sonar.coverage.exclusions=\
  **/*.test.js,\
  **/*.yaml,\
  **/*.yml,\
  **/test/**,\
  ui/i18n/**/*.json

# Explicitly exclude test files from source analysis
sonar.test.inclusions=**/test/**/*.test.js

# Encoding
sonar.sourceEncoding=UTF-8

# Fail CI and block PR merge when the Quality Gate is not met.
# Gate conditions (set in SonarCloud UI):
#   - New code coverage >= 90 %
#   - New code issues   == 0
sonar.qualitygate.wait=true

# Informational: binding threshold is enforced by the SonarCloud Quality Gate.
sonar.coverage.minimum=90

# Suppress all issues in CI workflow files (intentional patterns: npm install with preinstall scripts)
# TODO: Remove this suppression once the --ignore-scripts issue is fixed to allow using
# npm ci (or npm install --ignore-scripts) safely without breaking sub-package installation.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**
