<!--
A required multivalued property sets `required` on the table. The row field is independently
required when adding or editing an entry (WEBUI-2377).
-->
<dom-module id="multivalued-required-layout">
  <template>
    <nuxeo-input name="title" label="Title" value="[[title]]" required></nuxeo-input>

    <nuxeo-data-table items="[[items]]" name="multiString" editable required>
      <nuxeo-data-table-column name="Multi String">
        <template> [[item]] </template>
      </nuxeo-data-table-column>

      <nuxeo-data-table-form>
        <template>
          <nuxeo-input name="string" label="Multi String" value="{{item}}" required></nuxeo-input>
        </template>
      </nuxeo-data-table-form>
    </nuxeo-data-table>
  </template>
  <script>
    Polymer({
      is: 'multivalued-required-layout',
      properties: {
        title: String,
        items: {
          type: Array,
          value: () => [],
        },
      },
    });
  </script>
</dom-module>
